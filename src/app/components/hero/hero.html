<section class="hero" id="hero">
  <!-- Background image / gradient -->
  <div class="hero__bg" aria-hidden="true">
    <div class="hero__bg-gradient"></div>
  </div>

  <div class="hero__overlay" aria-hidden="true"></div>

  <!-- Content -->
  <div class="hero__content">
    <div class="hero__inner">

      <!-- Agent photo — above text on mobile, right column on desktop -->
      <div class="hero__photo-wrap" aria-hidden="true">
        <img
          src="images/agent.webp"
          alt=""
          class="hero__photo"
          [class.is-loaded]="photoLoaded()"
          (load)="photoLoaded.set(true)"
          decoding="async"
        />
      </div>

      <!-- Text column -->
      <div class="hero__text">
        <span class="hero__eyebrow">{{ lang.t().hero.eyebrow }}</span>

        <h1 class="hero__headline">
          @for (line of headlineLines; track $index) {
            <span class="hero__headline-line">{{ line }}</span>
          }
        </h1>

        <p class="hero__sub">{{ lang.t().hero.subheadline }}</p>

        <div class="hero__cta-group">
          <a href="tel:+995555123456" class="hero__cta-primary">
            {{ lang.t().hero.cta }}
            <lucide-icon name="ArrowRight" [size]="16" [strokeWidth]="2" />
          </a>
          <a href="#services" class="hero__cta-secondary">{{ lang.t().hero.ctaSecondary }}</a>
        </div>

        <div class="hero__badge">
          <lucide-icon name="Star" [size]="14" [strokeWidth]="0" class="hero__star-icon" />
          <span>{{ lang.t().hero.badge }}</span>
        </div>
      </div>

    </div>
  </div>

  <!-- Scroll indicator -->
  <div class="hero__scroll-indicator" aria-hidden="true">
    <span class="hero__scroll-line"></span>
  </div>
</section>
